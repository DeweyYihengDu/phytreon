[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "phytreon"
dynamic = ["version"]
description = "Phylogenetic trees and publication figures in Python"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Yiheng Du", email = "yiheng.du@slu.edu" }]
keywords = ["phylogenetics", "phylogenetic-tree", "tree", "visualization", "bioinformatics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "pandas>=1.4",
    "matplotlib>=3.5",
    "biopython>=1.79",
]

[project.optional-dependencies]
interactive = ["plotly>=5.0"]
# statsmodels and sympy are used by tests/test_reference_crosscheck.py only, to
# check the comparative methods against an independent implementation of the
# same maths (statsmodels.GLS) and against exact rational arithmetic (sympy).
# Not runtime dependencies; those tests skip if either is absent.
dev = ["pytest>=7", "plotly>=5.0", "ruff", "statsmodels>=0.13", "sympy>=1.10"]
docs = ["mkdocs-material", "mkdocstrings[python]"]

[project.urls]
Homepage = "https://github.com/DeweyYihengDu/phytreon"
Repository = "https://github.com/DeweyYihengDu/phytreon"
Documentation = "https://deweyyihengdu.github.io/phytreon/"
Issues = "https://github.com/DeweyYihengDu/phytreon/issues"
Changelog = "https://github.com/DeweyYihengDu/phytreon/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "phytreon.__version__" }

[tool.setuptools.packages.find]
include = ["phytreon*"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# State the rule set explicitly rather than inheriting whatever the installed
# ruff happens to default to. `ruff` is unpinned in the dev extras, so CI takes
# the latest release; a newer ruff that widens its defaults would otherwise
# turn a green build red without a line of this project changing.
select = ["E4", "E7", "E9", "F"]
